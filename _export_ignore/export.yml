export_root: "res://addons/_lib/gdscript_optimizer/_export_ignore/exports"
plugin_folder: "GdscriptOptimizer{{version=res://addons/_lib/gdscript_optimizer}}"
pre_script: ""
post_script: ""
build_require:
  - "brohd11/godot-addon-lib@v2.1.5"
  - "brohd11/godot-gdscript-parser@v0.2.0"
  - "brohd11/godot-tag-parser@v0.1.0"
  - "brohd11/godot-yaml-parser@v2.1.0"
compile_require: []
options:
  overwrite: true
  include_uid: true
  include_import: true
  ignore_src: true
  use_tag_in_cfg: true
  exported_deps: []
  include_min_version: true
  move_global_files: true
  include_docs: true
  include_project_license: false
  parser_settings:
    use_relative_paths: false
    backport_target: 100
    parse_cs:
      namespace_rename: {}
    parse_gd:
      replace_editor_interface: false
      optimizer:
        enabled: true
        debug_tags: false
        struct_mode: tagged
        inline_mode: tagged
        aggressive: false
      class_rename_ignore: []
      backport_string_renames: {}
    parse_tscn: {}
    parse_tres: {}
exports:
  -
    source: "res://addons/_lib/gdscript_optimizer"
    export_name: "gdscript-optimizer{{version=res://addons/_lib/gdscript_optimizer}}"
    export_folder: addons/_lib/gdscript_optimizer
    exclude:
      directories:
        - "res://addons/_lib/gdscript_optimizer/_export_ignore"
      file_extensions: []
      files: []
    other_transfers: []
    parser_overide_settings:
      parse_cs: {}
      parse_gd: {}
      parse_tscn: {}
      parse_tres: {}
    remote_dir: "res://addons/_lib/gdscript_optimizer/src/remote"
